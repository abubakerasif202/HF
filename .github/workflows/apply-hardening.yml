name: Apply HF Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden-verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply audited hardening patch
        run: python scripts/apply_hardening.py

      - name: Content-integrity guard
        run: |
          git diff --check
          git diff --stat
          if git grep -nE 'Open 24 Hours|24/7|24h Enquiries' -- app lib; then
            echo 'Stale 24-hour claim remains in production source.' >&2
            exit 1
          fi
          if git grep -nE 'adelaide-(western-sydney|smithfield|brisbane|canberra)' -- app lib; then
            echo 'Inferred interstate pricing route remains in production source.' >&2
            exit 1
          fi
          if git grep -niE 'Piano / Pool Table|Short/Long-Term Storage|Cleaning \(End of Lease\)|Rubbish/Junk Removal|Most Popular|Ideal for [1-9]|No extra charges for stairs|no hidden charges|only pay for the exact volume' -- app lib; then
            echo 'Unsupported service or marketing claim remains in production source.' >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build and rendered-route tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser QA
        run: npm run test:browser

      - name: Commit verified source changes to main
        run: |
          git rm scripts/apply_hardening.py .github/workflows/apply-hardening.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden verified business content and pricing'
          git push origin HEAD:main
