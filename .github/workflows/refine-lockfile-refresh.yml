name: Refine Lockfile Refresh (temporary)

on:
  push:
    branches:
      - feat/hf-refine-quotes-20261010
    paths:
      - .github/workflows/refine-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate exact dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit lockfile to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(hf): lock Refine core dependency"
            git push origin HEAD:feat/hf-refine-quotes-20261010
          fi
