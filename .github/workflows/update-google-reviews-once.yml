name: One-time Google review update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-google-reviews-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified Google rating update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "lib/site-data.ts": [
                  ('    rating: 4.9,', '    rating: 5.0,'),
                  ('    reviewCount: 417,', '    reviewCount: 438,'),
                  ('    verifiedAt: "2026-08-21",', '    verifiedAt: "2026-09-14",'),
              ],
              "app/components/Site.tsx": [
                  ('title: `${business.googleBusiness.rating} Google Rating`,', 'title: `${business.googleBusiness.rating.toFixed(1)} Google Rating`,'),
                  ('{business.googleBusiness.rating} Google Rating · {business.googleBusiness.reviewCount} Reviews', '{business.googleBusiness.rating.toFixed(1)} Google Rating · {business.googleBusiness.reviewCount} Reviews'),
                  ('<strong>{google.rating} / 5.0</strong>', '<strong>{google.rating.toFixed(1)} / 5.0</strong>'),
              ],
              "app/components/SiteClient.tsx": [
                  ('<strong>{business.googleBusiness.rating}/5.0</strong>', '<strong>{business.googleBusiness.rating.toFixed(1)}/5.0</strong>'),
                  ('Google Reviews ({business.googleBusiness.rating}★)', 'Google Reviews ({business.googleBusiness.rating.toFixed(1)}★)'),
              ],
              "app/page.tsx": [
                  ('// No aggregateRating here on purpose. The 4.9/417 figures come from the', '// No aggregateRating here on purpose. The Google rating/count figures come from the'),
              ],
              "tests/rendered-html.test.mjs": [
                  ('assert.match(html, /4\\.9 Google rating/i);', 'assert.match(html, /5\\.0 Google rating/i);'),
                  ('assert.match(html, /417(?:<!-- -->)? reviews/i);', 'assert.match(html, /438(?:<!-- -->)? reviews/i);'),
                  ("// The 4.9/417 figures are Google's, not reviews this site collects, so they must", "// The Google rating/count figures are Google's, not reviews this site collects, so they must"),
                  ('assert.match(data, /rating: 4\\.9/);', 'assert.match(data, /rating: 5\\.0/);'),
                  ('assert.match(data, /reviewCount: 417/);', 'assert.match(data, /reviewCount: 438/);'),
                  ('assert.match(data, /verifiedAt: "2026-08-21"/);', 'assert.match(data, /verifiedAt: "2026-09-14"/);'),
                  ('assert.doesNotMatch(stripComments(source), /4\\.9|417/, `${label} should read the rating from site-data`);', 'assert.doesNotMatch(stripComments(source), /4\\.9|417|438/, `${label} should read the rating from site-data`);'),
              ],
          }

          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected exactly one match in {file_name}: {old!r}; found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          git diff -- lib/site-data.ts app/components/Site.tsx app/components/SiteClient.tsx app/page.tsx tests/rendered-html.test.mjs

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build and tests
        run: npm test

      - name: Commit verified review update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/site-data.ts app/components/Site.tsx app/components/SiteClient.tsx app/page.tsx tests/rendered-html.test.mjs
          git commit -m "fix: update Google rating to 5.0 and 438 reviews"
          git push origin HEAD:main
